name: Production Deployment (Render)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.RENDER_APP_URL || 'https://dashboard.render.com' }}

    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Production Deploy
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render Production Deployment via Deploy Hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered! (HTTP $HTTP_CODE)"
              echo "$BODY"
            else
              echo "❌ Deploy hook returned HTTP $HTTP_CODE: $BODY"
              exit 1
            fi
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "🚀 Triggering Render Deployment via Render API..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Render API deployment triggered successfully!"
              echo "$BODY"
            else
              echo "❌ Render API returned HTTP $HTTP_CODE: $BODY"
              exit 1
            fi
          else
            echo "ℹ️ Render auto-deploy active via connected repository."
            echo "🎉 GitHub Production deployment marked successfully."
          fi
